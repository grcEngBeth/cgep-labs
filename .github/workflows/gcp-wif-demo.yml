name: gcp-wif-demo
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/167767996241/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: cgep-grc-gate-sa@cgep-labs-sm-2026.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud projects describe cgep-labs-sm-2026
